name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offchain:
    name: Off-chain suite + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  contracts:
    name: Rook contract suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install swap-vm deps
        working-directory: swap-vm
        run: corepack enable && yarn install --immutable
      - run: npm ci
      # lowmem profile builds anywhere; test:contracts:ci uses the canonical
      # via_ir + optimizer_runs=700 settings for machines with the headroom.
      - run: npm run test:contracts

  demo:
    name: DEMO-VERIFIED (two clean-state runs, byte-identical mechanism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install swap-vm deps
        working-directory: swap-vm
        run: corepack enable && yarn install --immutable
      - run: npm ci
      # No GEMINI_API_KEY secret here on purpose: this job proves the
      # mechanism (chain, contracts, subgraph indexing, gateway) is
      # byte-reproducible on its own. `npm run demo` (LLM live) is the
      # human-run path once a key is configured — see README §8.
      - run: npm run demo:mechanism
