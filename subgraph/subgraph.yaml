specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # Settlement registry — the source of truth for realized coverage.
  - kind: ethereum
    name: RookRegistry
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000" # set at deploy time
      abi: RookRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CoverageSettled
        - UnderwriterExecutionProfile
      abis:
        - name: RookRegistry
          file: ./abis/RookRegistry.json
      eventHandlers:
        - event: CoverageSettled(indexed bytes32,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleCoverageSettled
      file: ./src/mapping.ts

  # Aqua Core — positions shipped/docked. NOTE the real event has no indexed
  # fields and carries the full encoded strategy blob, not token arrays.
  - kind: ethereum
    name: Aqua
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000" # set at deploy time
      abi: Aqua
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - HedgeOffer
        - UnderwriterExecutionProfile
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/mapping.ts

  # SwapVM router — the RevocableRateOffer opcode's reprice/revoke events. This
  # is the authoritative cancellation signal for the reliability score.
  - kind: ethereum
    name: SwapVMRouter
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000" # set at deploy time
      abi: SwapVMRouter
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - UnderwriterExecutionProfile
      abis:
        - name: SwapVMRouter
          file: ./abis/SwapVMRouter.json
      eventHandlers:
        - event: OfferRepriced(indexed address,indexed bytes32,uint64,uint64)
          handler: handleOfferRepriced
        - event: OfferRevoked(indexed address,indexed bytes32)
          handler: handleOfferRevoked
      file: ./src/mapping.ts
